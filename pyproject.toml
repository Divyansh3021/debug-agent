[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debug-agent"
version = "0.2.0"
description = "Architecture skeleton of an agentic debugging system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0"]

[tool.setuptools.packages.find]
include = ["debug_agent*"]
